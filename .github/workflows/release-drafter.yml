# Drafts an in-progress GitHub Release from merged PRs. Categories/template
# live in .github/release-drafter.yml (local, repo-specific). See
# reusable-release-drafter.yml for the shared runner.
name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-release-draft:
    uses: and3rn3t/.github/.github/workflows/reusable-release-drafter.yml@cfff6f9b973d95b9e6f3f94d4d9b0771cf1a903f # v1
