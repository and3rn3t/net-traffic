# Consistency guard — warns on PRs when baseline config files drift from
# ai-template-repo. Switch mode to "fail" once the repo is clean to block drift.
name: Consistency

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    uses: and3rn3t/.github/.github/workflows/reusable-consistency-guard.yml@cfff6f9b973d95b9e6f3f94d4d9b0771cf1a903f # v1
    with:
      mode: warn
