# Validate workflow YAML against the real Actions schema on every PR that
# touches .github/workflows/. See reusable-actionlint.yml.
name: Actionlint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    uses: and3rn3t/.github/.github/workflows/reusable-actionlint.yml@cfff6f9b973d95b9e6f3f94d4d9b0771cf1a903f # v1
