name: CI/CD

on:
  push:
    branches: [main, master]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main, master]
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    name: Backend Checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -q -r requirements-dev.txt
        working-directory: backend

      - name: Run ruff (syntax errors + pyflakes)
        run: ruff check .
        working-directory: backend

      - name: Byte-compile backend sources
        run: python -m compileall -q .
        working-directory: backend

      - name: Run pytest
        run: python -m pytest
        working-directory: backend

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests & Quality Checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:run
        env:
          VITE_USE_REAL_API: 'false'

      # continue-on-error stays until the pre-existing integration-suite
      # failures are fixed (16/71 fail on unmodified main - not flaky, real gap)
      - name: Run integration tests
        run: npm run test:integration
        env:
          VITE_USE_REAL_API: 'false'
        continue-on-error: true

      - name: Build for Cloudflare Pages
        run: npm run build
        env:
          NODE_ENV: production
          # Build-time environment variables (optional - can be set in GitHub secrets)
          # If not set, defaults are used. Recommended: Set in Cloudflare Dashboard instead.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_USE_REAL_API: ${{ secrets.VITE_USE_REAL_API }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests
    # Only run E2E tests on push to main/master, not on PRs (to save CI time)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          VITE_USE_REAL_API: 'false'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: [unit-tests]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.unit-tests.result == 'success'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # One-time project/domain setup lives in docs/CLOUDFLARE_DEPLOYMENT.md,
      # not here - wrangler deploys to an existing project, it doesn't create one.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=net-traffic --branch=${{ github.ref_name }} --commit-dirty=false
