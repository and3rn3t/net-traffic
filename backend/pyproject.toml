[tool.ruff]
target-version = "py311"
exclude = [".venv", "venv"]

[tool.ruff.lint]
# Minimal real-correctness gate for CI (E9 syntax errors, F pyflakes).
# The broader style/modernization rule catalog (UP, BLE, DTZ, SIM, TRY, S, ...)
# surfaced ~788 findings on first run - opt into those incrementally later
# rather than gating CI on them now.
select = ["E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Safety net: a real stray-connection hang (see services/storage.py close())
# was found via this test suite - a bounded timeout keeps a future regression
# from burning a full CI run instead of failing fast.
timeout = 30

