[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501", # long strings/log messages; ruff format handles code line length
  "B008", # FastAPI's Depends()/Query() defaults are idiomatic
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Safety net: a real stray-connection hang (see services/storage.py close())
# was found via this test suite - a bounded timeout keeps a future regression
# from burning a full CI run instead of failing fast.
timeout = 30

